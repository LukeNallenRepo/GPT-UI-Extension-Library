
name: Automatic ZIP Extraction

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract ZIP archives
        shell: bash
        run: |
          python3 <<'PY'
          import zipfile
          import subprocess
          from pathlib import Path

          root = Path.cwd()

          archives = subprocess.check_output(
              ["git", "ls-files", "*.zip"],
              text=True
          ).splitlines()

          for archive in archives:
              zip_path = root / archive
              destination = zip_path.parent / zip_path.stem

              print(f"Extracting: {archive}")

              with zipfile.ZipFile(zip_path) as z:
                  for member in z.infolist():
                      target = (destination / member.filename).resolve()

                      if not target.is_relative_to(destination.resolve()):
                          raise ValueError(
                              f"Unsafe ZIP path: {member.filename}"
                          )

                      if member.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(
                              parents=True, exist_ok=True
                          )
                          with z.open(member) as source:
                              target.write_bytes(source.read())

              print(f"Extracted to: {destination.relative_to(root)}")

          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Automated ZIP extraction"
            git push
          else
            echo "No extracted files to commit."
          fi
          
